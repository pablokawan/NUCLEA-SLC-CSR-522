          description: "Mensagem de eco"
          minLength: 1
          maxLength: 50
    RelatorioDetalhadoPorNULiquid:
      type: "object"
      required:
      - "numCtrlRelat"
      - "cNPJCreddr"
      - "nomRedzdCred"
      - "iSPBIFDomicilio"
      - "nomRedzdID"
      - "dtRef"
      - "dtPgto"
      - "nULiquid"
      - "vlrPgto"
      - "codInstitdrArranjoPgto"
      - "nomInstitdrArranjoPgto"
      - "tpProd"
      - "sitSolictLiquidacao"
      - "sitRespDomicilio"
      - "codOcorc"
      properties:
        numCtrlRelat:
          type: "string"
          description: "Numero de controle da solicitacao do relatorio"
          pattern: "^\\d{20}$"
        cNPJCreddr:
          type: "string"
          description: "CNPJ Credenciador"
          pattern: "^\\d{14}$"
        nomRedzdCred:
          type: "string"
          description: "Nome Reduzido do Credenciador"
          minLength: 1
          maxLength: 80
        iSPBIFDomicilio:
          type: "string"
          description: "ISPB IF Domicilio"
          pattern: "^\\d{8}$"
        nomRedzdID:
          type: "string"
          description: "Nome Reduzido da Instituicao Domicilio"
          minLength: 1
          maxLength: 80
        dtRef:
          type: "string"
          description: "Data de Referencia"
          format: "date"
        dtPgto:
          type: "string"
          description: "Data de Pagamento"
          format: "date"
        nULiquid:
          type: "string"
          description: "Numero Unico da Transacao"
          pattern: "^\\d{21}$"
        vlrPgto:
          type: "number"
          description: "Valor do Pagamento"
          format: "double"
        codInstitdrArranjoPgto:
          type: "string"
