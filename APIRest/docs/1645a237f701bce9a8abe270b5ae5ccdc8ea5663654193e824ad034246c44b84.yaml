  /bases_controle/participantes:
    get:
      summary: >-
        Permitir que os Participantes consultem ICs e IFs no Ambiente de
        Interoperabilidade. (CERC-AP019A)
      parameters:
        - schema:
            type: string
            format: date
          in: query
          name: dataReferencia
          description: >-
            Data de Referência a Consulta. Caso não informada retorna todos os
            registros.
          required: false
          x-gitbook-description-html: >-
            <p>Data de Referência a Consulta. Caso não informada retorna todos
            os registros.</p>
        - schema:
            type: string
            enum:
              - '1'
              - '2'
              - '3'
          in: query
          name: tipoInstituicao
          description: |
            Identifica o tipo de operação correspondente àquela entrada, sendo:
            Caso não informado retorna todos os registros.
            - 1 =  Instituição credenciadora ou subcredenciadora
            - 2 =  Instituição financeira
            - 3 = Instituição não financeira
            - 4 = Instituição Domicílio
          required: false
          x-gitbook-description-html: >-
            <p>Identifica o tipo de operação correspondente àquela entrada,
            sendo:

            Caso não informado retorna todos os registros.</p>

            <ul>

            <li>1 =  Instituição credenciadora ou subcredenciadora</li>

            <li>2 =  Instituição financeira</li>

            <li>3 = Instituição não financeira</li>

            <li>4 = Instituição Domicílio</li>

            </ul>
      responses:
        '200':
          description: Resultado da consulta à Base de Controle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseControleParticipantesResponse'
          x-gitbook-description-html: <p>Resultado da consulta à Base de Controle</p>
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseControleErro'
          x-gitbook-description-html: <p>Dados inválidos</p>
      tags:
        - Bases de Controle
  /bases_controle/arranjos:
    get:
      summary: >-
        Permitir que os Participantes consultem Arranjos de Pagamentos  no
        Ambiente de Interoperabilidade. (CERC-AP019B)
      parameters:
        - schema:
            type: string
            format: date
          in: query
          name: dataReferencia
          description: >-
