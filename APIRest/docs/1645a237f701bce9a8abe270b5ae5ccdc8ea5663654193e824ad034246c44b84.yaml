  /v15/agenda/consultar:
    post:
      summary: >-
        Consultar informações de agenda por força de um contrato ou opt-in
        (CERC-AP005)
      parameters:
        - schema:
            type: boolean
          in: query
          name: online
          description: >-
            Parâmetro que indica o tipo de entrega de agenda online. Caso seja
            especificado como true,  será realizado um pedido de agenda para
            cada registradora de origem e a resposta será assíncrona  com os
            dados mais atualizados do ecossistema. Caso seja especificado como
            false, serão enviadas  agendas com os dados mais recentes
            disponíveis na CERC, sem consultar as demais registradoras.  Ambas
            as consultas caracterizam-se como Agenda Online a título de
            cobrança, conforme tabela vigente.
          required: false
          x-gitbook-description-html: >-
            <p>Parâmetro que indica o tipo de entrega de agenda online. Caso
            seja especificado como true,  será realizado um pedido de agenda
            para cada registradora de origem e a resposta será assíncrona  com
            os dados mais atualizados do ecossistema. Caso seja especificado
            como false, serão enviadas  agendas com os dados mais recentes
            disponíveis na CERC, sem consultar as demais registradoras.  Ambas
            as consultas caracterizam-se como Agenda Online a título de
            cobrança, conforme tabela vigente.</p>
      responses:
