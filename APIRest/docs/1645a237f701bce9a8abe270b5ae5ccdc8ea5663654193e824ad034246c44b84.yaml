            description: Nome fantasia do estabelecimento comercial.
            x-gitbook-description-html: <p>Nome fantasia do estabelecimento comercial.</p>
          tipoDocumentoUsuarioFinalRecebedor:
            type: string
            description: >
              Identificador do tipo de documento do usuário final recebedor,
              sendo:

              - 1 = CPF

              - 2 = CNPJ


              [Não atualizável]
            enum:
              - '1'
              - '2'
            x-gitbook-description-html: >-
              <p>Identificador do tipo de documento do usuário final recebedor,
              sendo:</p>

              <ul>

              <li>1 = CPF</li>

              <li>2 = CNPJ</li>

              </ul>

              <p>[Não atualizável]</p>
          documentoUsuarioFinalRecebedor:
            type: string
            description: >-
              Número do documento CNPJ ou CPF do usuário final recebedor. 14
              dígitos para CNPJ e 11 dígitos para CPF e completar com 0 à
              esquerda, se necessário.
            x-gitbook-description-html: >-
              <p>Número do documento CNPJ ou CPF do usuário final recebedor. 14
              dígitos para CNPJ e 11 dígitos para CPF e completar com 0 à
              esquerda, se necessário.</p>
          tipoUsuarioFinalRecebedor:
            type: string
            description: |
              Código do tipo de usuário final recebedor, sendo:
                - 1 = Estabelecimento comercial
                - 2 = Subcredenciadora
                - 3 = Ambos (Estabelecimento comercial + Subcredenciadora)

              [Não atualizável]
            enum:
              - '1'
              - '2'
              - '3'
            x-gitbook-description-html: |-
              <p>Código do tipo de usuário final recebedor, sendo:</p>
              <ul>
              <li>1 = Estabelecimento comercial</li>
              <li>2 = Subcredenciadora</li>
              <li>3 = Ambos (Estabelecimento comercial + Subcredenciadora)</li>
              </ul>
              <p>[Não atualizável]</p>
          status:
            type: string
            description: |
              Status do estbelecimento comercial:
                - 1 = Ativo: Estabelecimento Comercial está apto a transacionar
                - 2 = Inativo: Estabelecimento Comercial está inapto a transacionar e não possui agenda futura
                - 3 = Suspenso: Estabelecimento Comercial está inapto a transacionar e possui agendas futuras
            enum:
              - '1'
              - '2'
              - '3'
            x-gitbook-description-html: >-
              <p>Status do estbelecimento comercial:</p>

              <ul>

              <li>1 = Ativo: Estabelecimento Comercial está apto a
              transacionar</li>

              <li>2 = Inativo: Estabelecimento Comercial está inapto a
              transacionar e não possui agenda futura</li>

              <li>3 = Suspenso: Estabelecimento Comercial está inapto a
              transacionar e possui agendas futuras</li>

              </ul>
