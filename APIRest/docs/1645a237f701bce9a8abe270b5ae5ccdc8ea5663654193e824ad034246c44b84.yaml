components:
  schemas:
    EstabelecimentoListRequest:
      type: array
      items:
        required:
          - tipoOperacao
          - referenciaExterna
          - razaoSocial
          - tipoDocumentoUsuarioFinalRecebedor
          - documentoUsuarioFinalRecebedor
          - tipoUsuarioFinalRecebedor
          - status
          - codigoMCC
          - bloqueioLiquidacao
          - contato
        properties:
          tipoOperacao:
            type: string
            description: >
              Identifica o tipo de operação correspondente àquela entrada,
              sendo::
                - C = Criar novo estabelecimento comercial;
                - A = Atualizar estabelecimento comercial existente.
            enum:
              - C
              - A
            x-gitbook-description-html: >-
              <p>Identifica o tipo de operação correspondente àquela entrada,
              sendo::</p>

              <ul>

              <li>C = Criar novo estabelecimento comercial;</li>

              <li>A = Atualizar estabelecimento comercial existente.</li>

              </ul>
          referenciaExterna:
            type: string
            description: >-
              Código de referência único (exclusivo) de controle do
              participante, para identificação nas próximas transações
              relacionadas. [Não atualizável]
            x-gitbook-description-html: >-
              <p>Código de referência único (exclusivo) de controle do
              participante, para identificação nas próximas transações
              relacionadas. [Não atualizável]</p>
          razaoSocial:
            type: string
            description: >-
              Se PJ, preencher com a razão social do estabelecimento comercial.
              Se PF, preencher com o nome completo.
            x-gitbook-description-html: >-
              <p>Se PJ, preencher com a razão social do estabelecimento
              comercial. Se PF, preencher com o nome completo.</p>
